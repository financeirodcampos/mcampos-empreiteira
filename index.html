<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCampos — Gestão Empresarial</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg:#0d0f14; --bg2:#13161e; --bg3:#1a1e28; --bg4:#222636;
  --border:#2a2f3f; --border2:#3a4158;
  --accent:#e8a020; --accent2:#f5b840; --accent-dim:rgba(232,160,32,0.13);
  --text:#e8eaf0; --text2:#9aa0b8; --text3:#5a6080;
  --green:#3dd68c; --green-dim:rgba(61,214,140,0.1);
  --red:#f05c5c; --red-dim:rgba(240,92,92,0.1);
  --blue:#5b9cf6; --blue-dim:rgba(91,156,246,0.1);
  --purple:#a78bfa;
  --radius:10px; --radius-sm:6px;
  --sidebar-w:240px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* LOGIN */
#login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9999}
.login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:18px;padding:48px 40px;width:400px;text-align:center}
.login-logo{font-size:11px;font-weight:700;letter-spacing:4px;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.login-title{font-size:24px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--text3);margin-bottom:32px}
.login-users{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.login-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px;cursor:pointer;transition:all .2s;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:8px}
.login-btn:hover{border-color:var(--accent);background:var(--accent-dim)}
.login-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;margin:0 auto}
.login-name{font-size:12px;font-weight:600}
.login-role{font-size:10px;color:var(--text3)}
.sync-bar{display:flex;align-items:center;gap:6px;justify-content:center;font-size:11px;color:var(--text3);margin-top:16px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.sync-dot.off{background:var(--text3)}

/* APP SHELL */
#app{display:none;height:100vh;overflow:hidden}
.topbar{height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;position:fixed;top:0;left:0;right:0;z-index:100}
.topbar-logo{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
.topbar-sep{width:1px;height:18px;background:var(--border2)}
.topbar-title{font-size:13px;color:var(--text2);flex:1}
.topbar-sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.topbar-sync .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.topbar-sync .dot.syncing{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.topbar-user{display:flex;align-items:center;gap:8px}
.av-sm{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;cursor:pointer}
.topbar-logout{background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px;font-family:'Sora',sans-serif;padding:4px 8px;border-radius:4px}
.topbar-logout:hover{color:var(--red)}

/* SIDEBAR */
.sidebar{position:fixed;top:52px;left:0;bottom:0;width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;z-index:50;padding:12px 0}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.sidebar-section-title{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3);padding:12px 16px 4px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;font-size:12px;color:var(--text2);border-radius:0;transition:all .15s}
.sidebar-item:hover{color:var(--text);background:var(--bg3)}
.sidebar-item.active{color:var(--accent);background:var(--accent-dim)}
.sidebar-sep{height:1px;background:var(--border);margin:6px 12px}

/* MAIN */
.main{margin-left:var(--sidebar-w);margin-top:52px;height:calc(100vh - 52px);overflow-y:auto;background:var(--bg)}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.page{padding:28px 32px;max-width:1200px}
.page-header{margin-bottom:24px}
.page-header h1{font-size:22px;font-weight:700;margin-bottom:4px}
.page-header p{font-size:13px;color:var(--text3)}

/* CARDS */
.cards{display:grid;gap:16px;margin-bottom:24px}
.cards-4{grid-template-columns:repeat(4,1fr)}
.cards-3{grid-template-columns:repeat(3,1fr)}
.cards-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.card-val{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace;margin-bottom:4px}
.card-sub{font-size:11px;color:var(--text3)}
.accent{color:var(--accent)}
.green{color:var(--green)}
.blue{color:var(--blue)}
.red{color:var(--red)}
.card-accent{border-color:rgba(232,160,32,.3);background:linear-gradient(135deg,var(--bg2),rgba(232,160,32,.05))}
.card-green{border-color:rgba(61,214,140,.3);background:linear-gradient(135deg,var(--bg2),rgba(61,214,140,.05))}
.card-blue{border-color:rgba(91,156,246,.3);background:linear-gradient(135deg,var(--bg2),rgba(91,156,246,.05))}
.card-red{border-color:rgba(240,92,92,.3);background:linear-gradient(135deg,var(--bg2),rgba(240,92,92,.05))}

/* BLOCK */
.block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden}
.block-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.block-title{font-size:13px;font-weight:600}
.section-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;margin-top:8px}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:10px 14px;text-align:left;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3);color:var(--text)}
.empty-row td{text-align:center;color:var(--text3);padding:32px;font-size:12px}

/* STATUS BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.badge-green{background:var(--green-dim);color:var(--green)}
.badge-red{background:var(--red-dim);color:var(--red)}
.badge-blue{background:var(--blue-dim);color:var(--blue)}
.badge-yellow{background:rgba(245,200,66,.1);color:#f5c842}
.badge-purple{background:rgba(167,139,250,.1);color:var(--purple)}
.badge-gray{background:var(--bg3);color:var(--text3)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:12px;font-family:'Sora',sans-serif;font-weight:500;transition:all .15s}
.btn-accent{background:var(--accent);color:#000}
.btn-accent:hover{background:var(--accent2)}
.btn-ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border2)}
.btn-red{background:var(--red-dim);color:var(--red);border:1px solid rgba(240,92,92,.2)}
.btn-red:hover{background:rgba(240,92,92,.2)}
.btn-sm{padding:4px 8px;font-size:11px}
.btn-icon{width:28px;height:28px;padding:0;justify-content:center;font-size:14px}

/* DRIVE LINK */
.drive-link{color:var(--blue);font-size:11px;text-decoration:none}
.drive-link:hover{text-decoration:underline}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10000;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;width:520px;max-height:85vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:600}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1}
.modal-body{padding:20px 24px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--border)}

/* FORM */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-size:12px;font-family:'Sora',sans-serif;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:70px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text3);font-size:13px;gap:10px}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* FLOW */
.flow-item{display:flex;align-items:flex-start;gap:14px;margin-bottom:0}
.flow-dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.flow-connector{width:2px;height:36px;background:var(--border2);margin-left:21px}
.flow-content h4{font-size:13px;font-weight:600;margin-bottom:3px}
.flow-content p{font-size:11px;color:var(--text3);line-height:1.6}
.flow-content ul{font-size:11px;color:var(--text3);padding-left:14px;line-height:1.8}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:20px">
      <svg width="70" height="70" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:10px">
        <defs>
          <linearGradient id="sg" x1="50" y1="8" x2="60" y2="92" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7c8494"/>
            <stop offset="100%" stop-color="#3a404e"/>
          </linearGradient>
        </defs>
        <polygon points="50,6 90,26 84,76 50,94 16,76 10,26" fill="url(#sg)"/>
        <polygon points="50,6 90,26 50,36" fill="#9aa0b0" opacity="0.4"/>
        <polygon points="16,76 50,94 50,60" fill="#1e2330" opacity="0.3"/>
        <text x="50" y="63" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="30" fill="white">M</text>
      </svg>
      <div style="font-size:20px;font-weight:700;letter-spacing:4px;color:#c8cdd8">M CAMPOS</div>
      <div style="font-size:9px;font-weight:400;letter-spacing:6px;color:#6b7280;margin-top:3px">EMPREITEIRA</div>

      <div class="sync-dot" id="sync-dot-login"></div>
      <span id="sync-label-login">Conectando ao Firebase...</span>

</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:8px">
      <svg width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="tg" x1="50" y1="6" x2="60" y2="94" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#7c8494"/><stop offset="100%" stop-color="#3a404e"/></linearGradient></defs>
        <polygon points="50,6 90,26 84,76 50,94 16,76 10,26" fill="url(#tg)"/>
        <polygon points="50,6 90,26 50,36" fill="#9aa0b0" opacity="0.4"/>
        <text x="50" y="63" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="30" fill="white">M</text>
      </svg>
      <div style="display:flex;flex-direction:column;line-height:1.1">
        <span style="font-size:12px;font-weight:700;letter-spacing:2px;color:#c8cdd8">M CAMPOS</span>
        <span style="font-size:8px;letter-spacing:3px;color:#6b7280">EMPREITEIRA</span>
      </div>
    </div>
    <div class="topbar-sep"></div>
    <div class="topbar-title" id="topbar-title">Dashboard</div>
    <div class="topbar-sync">
      <div class="dot" id="sync-dot"></div>
      <span id="sync-label">Sincronizado</span>
    </div>
    <div class="topbar-user">
      <div class="av-sm" id="topbar-av"></div>
      <span style="font-size:11px;color:var(--text2)" id="topbar-name"></span>
      <button class="topbar-logout" onclick="logout()">Sair</button>
    </div>
  </div>
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-accent" id="modal-save">Salvar</button>
    </div>
  </div>
</div>

<script>
// ─── FIREBASE ───
const firebaseConfig = {
  apiKey: "AIzaSyBEzLkNWTL_dkZqG_kcw8O4NUwYwuGxblg",
  authDomain: "mcampos-empreiteira.firebaseapp.com",
  projectId: "mcampos-empreiteira",
  storageBucket: "mcampos-empreiteira.firebasestorage.app",
  messagingSenderId: "550100154344",
  appId: "1:550100154344:web:94651651f4a7e36f23965d",
  measurementId: "G-GWTTRL6TCY"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ─── STATE ───
let currentUser = null;
let modalSaveFn = null;
let currentPage = 'dashboard';
let unsubscribers = {};

// ─── SYNC UI ───
function setSyncing(on) {
  const d = document.getElementById('sync-dot');
  const l = document.getElementById('sync-label');
  if (!d) return;
  if (on) { d.classList.add('syncing'); l.textContent = 'Sincronizando...'; }
  else { d.classList.remove('syncing'); l.textContent = 'Sincronizado'; }
}

// ─── USERS (localStorage) ───
const DEFAULT_USERS = [
  { id:'u1', name:'Manuel', role:'Diretor', color:'#e8a020', initials:'MC' },
  { id:'u2', name:'Daniella', role:'Diretora Financeira', color:'#f05c5c', initials:'DA' },
];
function getUsers(){ return JSON.parse(localStorage.getItem('mc-users')||JSON.stringify(DEFAULT_USERS)); }
function saveUsers(u){ localStorage.setItem('mc-users', JSON.stringify(u)); }

function renderLoginUsers() {
  const users = getUsers();
  document.getElementById('login-users').innerHTML = users.map(u => `
    <div class="login-btn" onclick="login('${u.id}')">
      <div class="login-av" style="background:${u.color}">${u.initials}</div>
      <div class="login-name">${u.name}</div>
      <div class="login-role">${u.role}</div>
    </div>`).join('');
}

function login(uid) {
  const users = getUsers();
  currentUser = users.find(u => u.id === uid);
  if (!currentUser) return;
  localStorage.setItem('mc-current-user', uid);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('topbar-av').style.background = currentUser.color;
  document.getElementById('topbar-av').textContent = currentUser.initials;
  document.getElementById('topbar-name').textContent = currentUser.name;
  renderSidebar();
  navigate('dashboard');
}

function logout() {
  currentUser = null;
  localStorage.removeItem('mc-current-user');
  Object.values(unsubscribers).forEach(fn => fn && fn());
  unsubscribers = {};
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function openAddUser() {
  showModal('Novo Usuário', `
    <div class="field"><label>Nome</label><input id="nu-name" type="text" placeholder="Nome do usuário"></div>
    <div class="field"><label>Cargo/Função</label><input id="nu-role" type="text" placeholder="Ex: Engenheiro, Financeiro..."></div>
    <div class="field"><label>Iniciais (2-3 letras)</label><input id="nu-init" type="text" maxlength="3" placeholder="Ex: MC"></div>
    <div class="field"><label>Cor</label><input id="nu-color" type="color" value="#e8a020" style="height:36px;padding:2px"></div>
  `, () => {
    const name = v('nu-name'), role = v('nu-role'), init = v('nu-init').toUpperCase(), color = v('nu-color');
    if (!name || !init) return false;
    const users = getUsers();
    users.push({ id:'u'+Date.now(), name, role, color, initials:init });
    saveUsers(users);
    renderLoginUsers();
    return true;
  });
}

// ─── FIRESTORE HELPERS ───
async function getCol(col) {
  try {
    const snap = await db.collection(col).orderBy('_ts','asc').get();
    return snap.docs.map(d => ({ _id: d.id, ...d.data() }));
  } catch(e) {
    return [];
  }
}

async function addDoc(col, data) {
  setSyncing(true);
  try {
    await db.collection(col).add({ ...data, _ts: Date.now(), _by: currentUser?.name || '' });
  } catch(e) { console.error(e); }
  setSyncing(false);
}

async function delDoc(col, id) {
  setSyncing(true);
  try { await db.collection(col).doc(id).delete(); } catch(e) { console.error(e); }
  setSyncing(false);
}

// ─── NAVIGATION ───
const MENU = [
  { id:'dashboard', icon:'🏠', label:'Dashboard', top:true },
  { sec:'Diretoria Executiva' },
  { id:'dir-metas',      icon:'📊', label:'Metas & Indicadores' },
  { id:'dir-financeiro', icon:'💹', label:'Planejamento Financeiro' },
  { id:'dir-resultados', icon:'🎯', label:'Gestão de Resultados' },
  { id:'dir-expansao',   icon:'🚀', label:'Expansão' },
  { sec:'Administrativo' },
  { id:'adm-docs',      icon:'📁', label:'Controle Documental' },
  { id:'adm-contratos', icon:'📑', label:'Gestão de Contratos' },
  { id:'adm-forn',      icon:'🤝', label:'Fornecedores' },
  { sec:'Financeiro & Fiscal' },
  { id:'fin-pagar',   icon:'💸', label:'Contas a Pagar' },
  { id:'fin-receber', icon:'💰', label:'Contas a Receber' },
  { id:'fin-fiscal',  icon:'🧾', label:'Fiscal / NF' },
  { sec:'Gestão Operacional' },
  { id:'op-equipes',   icon:'👷', label:'Cadastro de Equipes' },
  { id:'op-precos',    icon:'💲', label:'Formação de Preços' },
  { id:'op-producao',  icon:'📈', label:'Controle de Produção' },
  { id:'op-indicadores',icon:'📉', label:'Indicadores Operacionais' },
  { sec:'Engenharia' },
  { id:'eng-obras',    icon:'🏗️', label:'Cadastro de Obras' },
  { id:'eng-definicoes',icon:'📐', label:'Definições de Obra' },
  { id:'eng-controle', icon:'🗂️', label:'Planejamento & Controle' },
  { id:'fluxo',        icon:'🔄', label:'Fluxo Macro' },
];

function renderSidebar() {
  let html = '';
  MENU.forEach(item => {
    if (item.sec) {
      html += `<div class="sidebar-sep"></div><div class="sidebar-section-title">${item.sec}</div>`;
    } else {
      html += `<div class="sidebar-item ${item.id===currentPage?'active':''}" onclick="navigate('${item.id}')"><span>${item.icon}</span>${item.label}</div>`;
    }
  });
  document.getElementById('sidebar').innerHTML = html;
}

function navigate(pid) {
  currentPage = pid;
  renderSidebar();
  const item = MENU.find(m => m.id === pid);
  document.getElementById('topbar-title').textContent = item ? item.label : '';
  const main = document.getElementById('main');
  main.innerHTML = `<div class="page"><div class="loading"><div class="spinner"></div> Carregando...</div></div>`;
  buildPage(pid).then(html => { main.innerHTML = `<div class="page">${html}</div>`; });
}

// ─── MODAL ───
function showModal(title, body, saveFn) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  modalSaveFn = saveFn;
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal-save').onclick = async () => {
    const ok = await modalSaveFn();
    if (ok !== false) { closeModal(); navigate(currentPage); }
  };
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });

// ─── HELPERS ───
function v(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function driveCell(url) {
  return url ? `<a href="${url}" target="_blank" class="drive-link">📎 Drive</a>` : '<span style="color:var(--text3)">—</span>';
}
const STATUS_OPTS = ['Em andamento','Concluído','Pendente','Cancelado','Aguardando','Planejado'];
function badge(status) {
  const map = { 'Em andamento':'blue','Concluído':'green','Pendente':'yellow','Cancelado':'red','Aguardando':'yellow','Planejado':'gray' };
  const cls = map[status] || 'gray';
  return `<span class="badge badge-${cls}">${status||'—'}</span>`;
}
function delBtn(col, id, pg) { return `<button class="btn btn-red btn-sm" onclick="delRow('${col}','${id}','${pg||currentPage}')">✕</button>`; }
async function delRow(col, id, pg) { await delDoc(col, id); navigate(pg||currentPage); }
function statusSelect(id,val='') {
  return `<select id="${id}">${STATUS_OPTS.map(s=>`<option ${s===val?'selected':''}>${s}</option>`).join('')}</select>`;
}

// ─── GENERIC TABLE BUILDER ───
async function buildTable(col, title, subtitle, headers, rowFn, openFn) {
  const rows = await getCol(col);
  const thead = headers.map(h=>`<th>${h}</th>`).join('');
  const tbody = rows.length
    ? rows.map(r=>`<tr>${rowFn(r)}</tr>`).join('')
    : `<tr class="empty-row"><td colspan="${headers.length}">Nenhum registro cadastrado.</td></tr>`;
  return `
    <div class="page-header"><h1>${title}</h1><p>${subtitle}</p></div>
    <div class="block">
      <div class="block-header">
        <div class="block-title">${title}</div>
        <button class="btn btn-accent btn-sm" onclick="(${openFn.toString()})()">+ Adicionar</button>
      </div>
      <div class="tbl-wrap"><table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>
    </div>`;
}

// ─── INIT ───
renderLoginUsers();

// Check Firebase connection
db.collection('_ping').add({ ts: Date.now() }).then(() => {
  db.collection('_ping').where('ts','<', Date.now()).get().then(s => s.docs.forEach(d => d.ref.delete()));
  document.getElementById('sync-dot-login').classList.remove('off');
  document.getElementById('sync-label-login').textContent = 'Firebase conectado ✓';
}).catch(() => {
  document.getElementById('sync-dot-login').classList.add('off');
  document.getElementById('sync-label-login').textContent = 'Sem conexão';
});

// Auto-login
const saved = localStorage.getItem('mc-current-user');
if (saved) {
  const users = getUsers();
  const u = users.find(x => x.id === saved);
  if (u) setTimeout(() => login(u.id), 100);
}
